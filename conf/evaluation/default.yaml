# ── Fresh evaluation (held-out test phase) ────────────────────────────────────
# Evaluates the final incumbent prompt on seeds and inference seeds never seen
# during optimisation. Runs after optimisation completes.

env_seed: 500           # Base environment seed for eval episodes. Must differ
                        # from optimisation.env_seed (42) to ensure held-out
                        # episodes the prompt never trained on.

inference_seeds: [2, 3, 4, 5, 6, 7]
                        # One full evaluation run per inference seed, averaged
                        # for the final result. Multiple seeds control for LLM
                        # non-determinism. Add seeds to increase confidence.

episodes: 20            # Episodes per inference seed per task. Total eval
                        # episodes = episodes × len(inference_seeds) × n_tasks.

workers: ${rollout.workers}
                        # Parallel workers for eval. Defaults to rollout.workers.
                        # Override here to use more workers during batch eval.

# ── LLM configs ───────────────────────────────────────────────────────────────
# Default to rollout values via interpolation — same model used for eval as
# was used during optimisation. Override either field to test cross-model
# transfer (e.g. eval with a different model than was optimised for).

actor:
  model: ${rollout.actor.model}
  max_tokens: ${rollout.actor.max_tokens}
  temperature: ${rollout.actor.temperature}

descriptor:
  model: ${rollout.descriptor.model}
  max_tokens: ${rollout.descriptor.max_tokens}
  temperature: ${rollout.descriptor.temperature}
