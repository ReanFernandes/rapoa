    prompt_variant: minimal
    agent:
      type: balrog
      history_length: 16
    acceptance:
      rule: mean
      reward_threshold: 0.05
      min_discordant_pairs: 4
      p_threshold: 0.05
      validation_strategy: train_signal

  # ── 1-step history ────────────────────────────────────────────────────────────

  # h1 guided — always-accept
