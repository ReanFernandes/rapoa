    acceptance:
      rule: mean
      reward_threshold: 0.05
      min_discordant_pairs: 4
      p_threshold: 0.05
      validation_strategy: train_signal

  # h1 plain — always-accept
  - type: balrog
    prompt_variant: minimal
    agent:
      type: balrog
