env: babyai
models: local
agent: descriptor_actor

run_name: threshold_sweep
resume: true
log_root: optimization_runs
eval_log_root: logs_fresh_eval_optimised

# Threshold sensitivity sweep for SPA guided (paper: Figure 4).
# Crosses δ ∈ {0.00, 0.02, 0.05, 0.10} with HSP and LSP selection pressure.

experiments:

  # δ=0.00 — HSP
  - type: spa
    prompt_variant: rich
    module_constraint: both
    acceptance:
      rule: mean
      reward_threshold: 0.0
      min_discordant_pairs: 0
      p_threshold: 0.05
      validation_strategy: validation_bag

  # δ=0.00 — LSP
  - type: spa
    prompt_variant: rich
    module_constraint: both
    acceptance:
      rule: mean
      reward_threshold: 0.0
      min_discordant_pairs: 0
      p_threshold: 0.05
      validation_strategy: train_signal

  # δ=0.02 — HSP
  - type: spa
    prompt_variant: rich
    module_constraint: both
    acceptance:
      rule: mean
      reward_threshold: 0.02
      min_discordant_pairs: 4
      p_threshold: 0.05
      validation_strategy: validation_bag

  # δ=0.02 — LSP
  - type: spa
    prompt_variant: rich
    module_constraint: both
    acceptance:
      rule: mean
      reward_threshold: 0.02
      min_discordant_pairs: 4
      p_threshold: 0.05
      validation_strategy: train_signal

  # δ=0.05 — HSP
  - type: spa
    prompt_variant: rich
    module_constraint: both
    acceptance:
      rule: mean
      reward_threshold: 0.05
      min_discordant_pairs: 4
      p_threshold: 0.05
      validation_strategy: validation_bag

  # δ=0.05 — LSP
  - type: spa
    prompt_variant: rich
    module_constraint: both
    acceptance:
      rule: mean
      reward_threshold: 0.05
      min_discordant_pairs: 4
      p_threshold: 0.05
      validation_strategy: train_signal

  # δ=0.10 — HSP
  - type: spa
    prompt_variant: rich
    module_constraint: both
    acceptance:
      rule: mean
      reward_threshold: 0.10
      min_discordant_pairs: 4
      p_threshold: 0.05
      validation_strategy: validation_bag

  # δ=0.10 — LSP
  - type: spa
    prompt_variant: rich
    module_constraint: both
    acceptance:
      rule: mean
      reward_threshold: 0.10
      min_discordant_pairs: 4
      p_threshold: 0.05
      validation_strategy: train_signal
